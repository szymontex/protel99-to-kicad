name: release

# Publishing runs on a published GitHub release, so the tag, the notes and the
# artefacts on PyPI are the same event. Nothing here holds a token: PyPI trusts
# this workflow through OIDC, which is configured once on pypi.org and needs no
# secret in the repository.
#
# No deployment environment is used, so the trusted publisher on pypi.org is
# configured with its environment field left empty. Publishing a release is
# already a deliberate act; a second approval gate would only add a setting
# that can silently disagree with this file.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # the whole of the authentication
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
