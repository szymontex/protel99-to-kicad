[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protel99-to-kicad"
version = "0.2.0"
description = "Convert legacy Protel PCB board files - Autotrax, Easytrax, Advanced PCB, Protel for Windows, PCB ASCII and .ddb design databases - to KiCad"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Szymon Gwóźdź" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
keywords = ["protel", "kicad", "pcb", "eda", "autotrax", "easytrax", "altium",
            "file-format", "converter"]

[project.scripts]
protel-to-kicad = "protel99_parser.pcb9_kicad:main"

[project.urls]
Homepage = "https://github.com/szymontex/protel99-to-kicad"
Repository = "https://github.com/szymontex/protel99-to-kicad"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
